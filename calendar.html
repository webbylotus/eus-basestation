<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Calendar Widget</title>
    <style>
        :root {
            /* Light Mode Defaults */
            --background-color: #ffffff;
            --text-color: #333333;
            --day-name-color: #666666;
            --border-color: #eeeeee;
            --today-bg: #e0e0e0; /* A subtle background for today in light mode */
            --today-circle-border: #ff0000;
            --today-circle-text: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Dark Mode Overrides */
                --background-color: #2c2c2c;
                --text-color: #e0e0e0;
                --day-name-color: #aaaaaa;
                --border-color: #444444;
                --today-bg: #4a4a4a; /* A subtle background for today in dark mode */
                --today-circle-border: #ff3333; /* Slightly brighter red for dark mode */
                --today-circle-text: #ffffff;
            }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            overflow: hidden; /* Prevent scrollbars if content is slightly larger */
        }

        .calendar-container {
            width: 300px; /* Adjust as needed for a 2x2 conceptual space */
            padding: 15px;
            background-color: var(--background-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Subtle shadow */
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .calendar-header {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: var(--text-color);
        }

        .calendar-days, .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px; /* Spacing between cells */
            text-align: center;
        }

        .calendar-days div {
            font-size: 0.85em;
            color: var(--day-name-color);
            padding: 8px 0;
        }

        .calendar-grid div {
            padding: 8px 0;
            border-radius: 8px; /* Slightly rounded corners for cells */
            cursor: default; /* Indicate non-interactive */
            user-select: none; /* Prevent text selection */
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 500;
        }

        .calendar-grid div.empty {
            background-color: transparent;
            pointer-events: none; /* Make empty cells unclickable */
        }

        .calendar-grid div.today {
            background-color: var(--today-bg); /* Subtle background for today */
            position: relative;
            z-index: 1;
            font-weight: bold;
            color: var(--text-color); /* Ensure text is visible */
        }

        .calendar-grid div.today::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px; /* Size of the red circle */
            height: 30px;
            background-color: var(--today-circle-border); /* Red circle background */
            border-radius: 50%;
            z-index: -1; /* Behind the number */
        }

        .calendar-grid div.today span {
            color: var(--today-circle-text); /* White text for the number inside the red circle */
            position: relative; /* Bring number above pseudo-element */
            z-index: 2;
        }

        /* Optional: Hover effect for non-today dates */
        .calendar-grid div:not(.empty):not(.today):hover {
            background-color: rgba(0, 0, 0, 0.05); /* Light hover effect */
            transform: scale(1.03);
            transition: background-color 0.2s, transform 0.2s;
        }
        @media (prefers-color-scheme: dark) {
            .calendar-grid div:not(.empty):not(.today):hover {
                background-color: rgba(255, 255, 255, 0.05); /* Dark hover effect */
            }
        }
    </style>
</head>
<body>
    <div class="calendar-container">
        <div class="calendar-header" id="calendarHeader"></div>
        <div class="calendar-days">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>
        <div class="calendar-grid" id="calendarGrid">
            </div>
    </div>

    <script>
        const calendarHeader = document.getElementById('calendarHeader');
        const calendarGrid = document.getElementById('calendarGrid');

        const today = new Date();
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();

        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        function renderCalendar() {
            calendarGrid.innerHTML = ''; // Clear previous grid

            const firstDayOfMonth = new Date(currentYear, currentMonth, 1).getDay(); // 0 for Sunday, 1 for Monday, etc.
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate(); // Last day of current month

            calendarHeader.textContent = `${monthNames[currentMonth]} ${currentYear}`;

            // Add empty cells for days before the 1st of the month
            for (let i = 0; i < firstDayOfMonth; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.classList.add('empty');
                calendarGrid.appendChild(emptyDiv);
            }

            // Add actual days
            for (let day = 1; day <= daysInMonth; day++) {
                const dayDiv = document.createElement('div');
                const span = document.createElement('span');
                span.textContent = day;
                dayDiv.appendChild(span);

                // Highlight today's date
                if (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) {
                    dayDiv.classList.add('today');
                }
                calendarGrid.appendChild(dayDiv);
            }
        }

        // Initial render
        renderCalendar();
    </script>
</body>
</html>
